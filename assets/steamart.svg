<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2838"/>
      <stop offset="1" stop-color="#0c1218"/>
    </linearGradient>
    <linearGradient id="art" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#66c0f4"/>
      <stop offset="1" stop-color="#2a6a94"/>
    </linearGradient>
  </defs>

  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <rect x="4" y="4" width="248" height="248" rx="49" fill="none"
        stroke="#66c0f4" stroke-opacity="0.28" stroke-width="3"/>

  <!-- The library capsule: the artwork slot this app exists to fill. -->
  <rect x="58" y="44" width="102" height="153" rx="12" fill="url(#art)"/>
  <path d="M58 158 L92 118 L118 148 L140 126 L160 145 V185 A12 12 0 0 1 148 197
           H70 A12 12 0 0 1 58 185 Z" fill="#0f1b26" fill-opacity="0.55"/>
  <circle cx="128" cy="80" r="14" fill="#cfeaff" fill-opacity="0.85"/>

  <!-- A second capsule behind it, hinting at a whole library. -->
  <rect x="168" y="66" width="34" height="109" rx="9" fill="#66c0f4" fill-opacity="0.32"/>

  <!-- Download arrow: art being fetched in. -->
  <g stroke="#8bc34a" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M196 186 V222"/>
    <path d="M178 206 L196 224 L214 206"/>
  </g>
</svg>
